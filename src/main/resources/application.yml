spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: interviewai-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: user:email, read:user
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile

  ai:
#    anthropic:                          # [주석 처리 - Anthropic API]
#      api-key: ${ANTHROPIC_API_KEY}
#      chat:
#        options:
#          model: claude-sonnet-4-6
    openai:
      api-key: ${GEMINI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        completions-path: /chat/completions
        options:
          model: gemini-2.5-flash

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

server:
  port: 8080
  tomcat:
    max-post-size: 50MB

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000

app:
  frontend-url: http://localhost:5173

interview:
  prompt:
    max-document-length: 5000
    max-job-posting-length: 1500
    max-history-tokens: 8000
    max-eval-history-tokens: 4000
    max-feedback-tokens: 30000
    chars-per-token: 3
    max-summary-tokens: 500
    summary-enabled: true
  sse:
    timeout-ms: 120000
    pool:
      core-size: 4
      max-size: 8
      queue-capacity: 50

github:
  api:
    base-url: https://api.github.com
    max-repos: 10
    max-readme-length: 500
    max-languages: 5
    parallel-timeout-seconds: 30
    max-detail-repos: 3
    max-commits: 5
    max-branches: 30
    max-pull-requests: 5
    max-issues: 5

encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY}

job-crawler:
  timeout-ms: 10000
  max-text-length: 3000
  user-agent: "Mozilla/5.0 (compatible; InterviewAI/1.0)"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,llm-metrics
  endpoint:
    llm-metrics:
      access: read-only
  metrics:
    tags:
      application: ${spring.application.name}

cors:
  allowed-origins:
    - http://localhost:5173
    - http://localhost:3000
    - https://*.cloudfront.net

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
